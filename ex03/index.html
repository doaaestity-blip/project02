<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03: Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <section>
            <h2>Color Swatches</h2>
            <div class="palette">
                <div class="swatch named">Named</div>
                <div class="swatch hex">HEX</div>
                <div class="swatch rgb">RGB</div>
                <div class="swatch rgba">RGBA</div>
            </div>
        </section>

        <section>
            <h2>Opacity vs RGBA Comparison</h2>
            <div class="comparison">
                <div class="box opacity-box">
                    <p>Opacity Box (Fades Children)</p>
                    <p>Opacity: 0.5 (Fades this text too)</p>
                </div>
                <div class="box rgba-box">
                    <p>RGBA Box (Isolates Background)</p>
                    <p>RGBA: rgba(..., 0.5) (Isolates background)</p>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
